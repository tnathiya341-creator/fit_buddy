<!doctype html><html><head><title>FitBuddy</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="box">
<h1>FitBuddy</h1><p>AI Fitness Plan Generator</p>
<form action="/generate-workout" method="post">
<label>Name</label><input name="username" required>
<label>User ID</label><input name="user_id" required>
<label>Age</label><input name="age" type="number" min="1" max="119" required>
<label>Weight (kg)</label><input name="weight" type="number" step="0.1" min="1" required>
<label>Fitness Goal</label><select name="goal"><option>weight loss</option><option>muscle gain</option><option>general wellness</option><option>flexibility</option></select>
<label>Workout Intensity</label><select name="intensity"><option>low</option><option>medium</option><option>high</option></select>
<button>Generate Plan</button></form><a href="/view-all-users">Admin / Coach View</a></div></body></html>
